name: Build marble GKI 5.10.236 - DroidSpaces + SukiSU Ultra (KPM)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build.yml'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 cpio pahole libncurses-dev rsync \
            curl zip unzip tar xz-utils gcc g++ gawk openssl

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync GKI source (PINNED common-android12-5.10-2025-05 = 5.10.236)
        run: |
          mkdir -p ~/gki
          cd ~/gki
          # PINNED monthly release manifest: marble stock is 5.10.236-android12-9-00003-gfb24cf99ad97 (2025-05, base tag android12-5.10-2025-05_r6)
          # NEVER track branch HEAD common-android12-5.10 - it drifts (2026-08 HEAD built 5.10.264-android12-9 -> vermagic/driver mismatch vs vendor)
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10-2025-05 --depth=1
          # Monthly manifest references branch android12-5.10-2025-05 on kernel/common, but monthly
          # releases only keep TAGS there (branch deleted). Override via local manifest to the exact
          # stock base tag r6: peeled commit fb24cf99ad97 == marble stock -gfb24cf99ad97
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/marble-pin.xml <<'LM'
          <manifest>
            <remove-project name="kernel/common" />
            <project path="common" name="kernel/common" revision="refs/tags/android12-5.10-2025-05_r6" />
          </manifest>
          LM
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --optimized-fetch --prune
          echo "=== sync done ==="
          du -sh ~/gki
          # Fail fast if version drifted from 5.10.236
          KD=$(ls -d common 2>/dev/null || ls -d kernel/common 2>/dev/null)
          SUB=$(grep -E "^[[:space:]]*SUBLEVEL" "$KD/Makefile" | head -n1)
          echo "Makefile $SUB | common HEAD: $(git -C "$KD" log --oneline -1 || echo n/a)"
          # GNU style Makefile uses 'SUBLEVEL = 236' (spaces), tolerate both
          echo "$SUB" | grep -Eq "SUBLEVEL[[:space:]]*=[[:space:]]*236" || { echo "::error::kernel source is not 5.10.236 (got: $SUB) - manifest pin broken"; exit 1; }
          find . -name "gki_defconfig" | head -n 5

      - name: Apply DroidSpaces kABI patches (GKI 5.10)
        run: |
          set -e
          cd ~/gki
          # Clone DroidSpaces-OSS for patches
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS /tmp/Droidspaces-OSS
          ls /tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/

          # Find kernel common dir (manifest puts kernel in ./common)
          if [ -d common ]; then KDIR=common; elif [ -d kernel/common ]; then KDIR=kernel/common; else KDIR=$(find . -name "Kconfig" -path "*/arch/arm64/*" | head -n1 | xargs dirname | xargs dirname | xargs dirname); fi
          echo "KDIR=$KDIR"
          ls "$KDIR" | head -n 20

          cd "$KDIR"
          # 1) SYSVIPC kABI fix - must succeed, try 6_7_8 variant first
          echo "=== Apply 001 SYSVIPC kABI ==="
          patch -p1 < /tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          echo "001 applied: $?"

          # 2) POSIX_MQUEUE kABI fix - only for 5.10 and below
          echo "=== Apply 002 POSIX_MQUEUE kABI (5.10 only) ==="
          patch -p1 < /tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch
          echo "002 applied: $?"

          # Show patched files
          git diff --stat || true

      - name: Patch gki_defconfig for DroidSpaces
        run: |
          set -e
          DEFCONFIG=~/gki/common/arch/arm64/configs/gki_defconfig
          echo "DEFCONFIG=$DEFCONFIG"
          cat "$DEFCONFIG" | head -n 50

          # Helper: ensure CONFIG_FOO=y (replace is not set or append)
          ensure_y() {
            local cfg="$1"
            local file="$DEFCONFIG"
            if grep -q "# CONFIG_${cfg} is not set" "$file"; then
              sed -i "s/# CONFIG_${cfg} is not set/CONFIG_${cfg}=y/" "$file"
              echo " -> $cfg: replaced not set -> y"
            elif grep -q "CONFIG_${cfg}=y" "$file"; then
              echo " -> $cfg already y"
            elif grep -q "CONFIG_${cfg}=" "$file"; then
              sed -i "s/CONFIG_${cfg}=.*/CONFIG_${cfg}=y/" "$file"
              echo " -> $cfg: flipped -> y"
            else
              echo "CONFIG_${cfg}=y" >> "$file"
              echo " -> $cfg: appended y"
            fi
          }

          # DroidSpaces GKI exclusive fragment (from Kernel-Configuration.md#GKI)
          ensure_y SYSVIPC
          ensure_y POSIX_MQUEUE
          ensure_y IPC_NS
          ensure_y PID_NS
          ensure_y DEVTMPFS
          ensure_y NETFILTER_XT_MATCH_ADDRTYPE
          # Optional recommended
          ensure_y USER_NS
          ensure_y TMPFS_POSIX_ACL
          ensure_y TMPFS_XATTR
          ensure_y NETFILTER_XT_TARGET_REJECT
          ensure_y NETFILTER_XT_TARGET_LOG
          ensure_y NETFILTER_XT_MATCH_RECENT
          ensure_y IP_SET
          ensure_y IP_SET_HASH_IP
          ensure_y IP_SET_HASH_NET
          ensure_y NETFILTER_XT_SET

          # KPROBES is required by KSU/SukiSU
          ensure_y KPROBES
          ensure_y KALLSYMS
          ensure_y KALLSYMS_ALL

          # LTO/CFI MUST match stock kernel environment or vendor_dlkm modules
          # fail to load -> bootloop. Stock marble uses LTO_CLANG_FULL + CFI_CLANG.
          # CI OOM fix: use LTO_CLANG_THIN (Wild-Kernels style; memory-friendly but
          # still real LTO so CONFIG_CFI_CLANG keeps working). NEVER use LTO_NONE.
          echo "=== LTO_THIN + keep CFI (stock-compatible) ==="
          sed -i '/CONFIG_LTO/d' "$DEFCONFIG"
          echo "# CONFIG_LTO_NONE is not set" >> "$DEFCONFIG"
          echo "CONFIG_LTO_CLANG_THIN=y" >> "$DEFCONFIG"
          # CONFIG_CFI_CLANG stays as stock (y); do not touch it
          grep -E "CONFIG_LTO|CONFIG_CFI" "$DEFCONFIG" || true

          # Bypass GKI savedefconfig check (fragment appended at end, not sorted)
          echo "=== Bypass check_defconfig for CI ==="
          echo "--- before POST_DEFCONFIG_CMDS ---"
          cat ~/gki/common/build.config.gki || true
          sed -i 's/POST_DEFCONFIG_CMDS="check_defconfig"/POST_DEFCONFIG_CMDS="true"/' ~/gki/common/build.config.gki || true
          echo "--- after POST_DEFCONFIG_CMDS ---"
          cat ~/gki/common/build.config.gki || true

          echo "=== gki_defconfig diff ==="
          grep -E "CONFIG_(SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|USER_NS|KPROBES|KPM|KSU)" "$DEFCONFIG" || true
          # Show full file tail
          echo "--- tail ---"
          tail -n 30 "$DEFCONFIG"

      - name: Setup SukiSU Ultra + KPM
        run: |
          set -e
          cd ~/gki
          # Detect GKI root (where drivers/ lives)
          if [ -d common ]; then GKI_ROOT=$(realpath common/.. 2>/dev/null || echo ~/gki); else GKI_ROOT=~/gki; fi
          # Common is at ~/gki/common
          GKI_ROOT=~/gki
          echo "GKI_ROOT=$GKI_ROOT"
          ls "$GKI_ROOT/common/drivers" | head -n 5 || ls "$GKI_ROOT/drivers" | head -n 5 || true

          # Setup SukiSU Ultra latest
          cd "$GKI_ROOT"
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s

          # Verify drivers/kernelsu linked
          ls -l common/drivers/kernelsu 2>/dev/null || ls -l drivers/kernelsu 2>/dev/null || echo "kernelsu symlink check done"
          cat common/drivers/Kconfig 2>/dev/null | grep -A2 kernelsu || cat drivers/Kconfig | grep -A2 kernelsu || true

          # Enable KPM in defconfig (SukiSU KPM requires CONFIG_KPM=y + KALLSYMS)
          DEFCONFIG=~/gki/common/arch/arm64/configs/gki_defconfig
          echo "Enabling CONFIG_KPM and KSU in $DEFCONFIG"
          echo "--- before ---"
          grep -E "CONFIG_(KSU|KPM)" "$DEFCONFIG" || echo "not found before"
          # Ensure KSU is enabled - force add/replace
          if grep -q "# CONFIG_KSU is not set" "$DEFCONFIG"; then
            sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/' "$DEFCONFIG"
          fi
          # Remove any existing line and re-add to ensure y
          sed -i '/CONFIG_KSU=/d' "$DEFCONFIG"
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          if grep -q "# CONFIG_KPM is not set" "$DEFCONFIG"; then
            sed -i 's/# CONFIG_KPM is not set/CONFIG_KPM=y/' "$DEFCONFIG"
          fi
          sed -i '/CONFIG_KPM=/d' "$DEFCONFIG"
          echo "CONFIG_KPM=y" >> "$DEFCONFIG"
          # KPM needs KALLSYMS_ALL already ensured
          echo "--- after ---"
          grep -E "CONFIG_(KSU|KPM|KPROBES|KALLSYMS)" "$DEFCONFIG" || true
          echo "=== tail defconfig ==="
          tail -n 20 "$DEFCONFIG"

      - name: Apply SUSFS patches (KSU build)
        run: |
          set -e
          git clone -q https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 /tmp/susfs4ksu
          cd /tmp/susfs4ksu
          SUSFS_COMMIT=$(git rev-parse HEAD)
          SUSFS_VER=$(grep -m1 'SUSFS_VERSION' kernel_patches/include/linux/susfs.h | cut -d'"' -f2 || echo unknown)
          echo "SUSFS $SUSFS_VER @ $SUSFS_COMMIT"
          KD=~/gki/common
          [ -d "$KD" ] || KD=~/gki/kernel/common
          cp -v kernel_patches/fs/* "$KD/fs/"
          cp -v kernel_patches/include/linux/* "$KD/include/linux/"
          cd "$KD"
          echo "=== apply 50_add_susfs_in_gki-android12-5.10.patch ==="
          patch -p1 < /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch
          # SUSFS configs (mirrors WildKernels known-good set)
          DEFCONFIG=$KD/arch/arm64/configs/gki_defconfig
          for CFG in KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP; do
            sed -i "/^# CONFIG_${CFG} is not set/d; /^CONFIG_${CFG}=/d" "$DEFCONFIG"
            echo "CONFIG_${CFG}=y" >> "$DEFCONFIG"
          done
          grep -E "CONFIG_KSU" "$DEFCONFIG" | tail -n 20
          git status --short | head -n 20

      - name: Build GKI kernel
        run: |
          set -e
          # Add 8GB swap to avoid LTO OOM (exit 143) on 7GB runner
          echo "=== Setup swap ==="
          sudo swapoff -a 2>/dev/null || true
          sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          # Reduce parallelism to avoid OOM: -j2 for LTO
          echo "=== CPU ==="
          nproc
          cat /proc/meminfo | head -n 20

          cd ~/gki
          # Disable KMI strict check for CI (we disabled CFI/LTO, so __cfi_slowpath mismatch is expected)
          echo "=== Disable KMI strict mode for CI ==="
          # Patch build.config to allow mismatch: set KMI_SYMBOL_LIST_STRICT_MODE=0
          grep -n "KMI_SYMBOL_LIST_STRICT_MODE" common/build.config.gki.aarch64 || true
          sed -i 's/KMI_SYMBOL_LIST_STRICT_MODE=1/KMI_SYMBOL_LIST_STRICT_MODE=0/' common/build.config.gki.aarch64 || true
          grep -n "KMI" common/build.config.gki.aarch64 | head || true
          # Show toolchain info
          ls -la prebuilts/ 2>/dev/null | head -n 20 || true
          # Build - android12-5.10 uses build/build.sh with limited jobs (use pipefail so KMI error fails build)
          set -o pipefail
          KMI_SYMBOL_LIST_STRICT_MODE=0 BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh -j2 2>&1 | tee build.log || true
          echo "build.sh exit: ${PIPESTATUS[0]}"
          echo "=== Build finished ==="
          ls -lh out/android12-5.10/dist/ 2>/dev/null || ls -lh out/*/dist/ 2>/dev/null || find out -type f -name "Image*" | head -n 20
          cat build.log | tail -n 100

      - name: Version gate + build bypass (no-KSU) Image
        run: |
          set -e
          DIST=$(find ~/gki/out -type d -name dist | head -n1)
          KVER=$(strings "$DIST/Image" | grep -m1 "Linux version 5")
          echo "main KSU kernel: $KVER"
          echo "$KVER" | grep -q "5.10.236-android12-9" || { echo "::error::built kernel drifted: $KVER (expected 5.10.236-android12-9)"; exit 1; }
          mkdir -p /tmp/ak3-images
          cp -v "$DIST/Image" /tmp/ak3-images/Image-ksu
          # BYPASS variant = same kernel, KernelSU/KPM compiled out (no root; bypass = skip KSU install)
          DEFCONFIG=~/gki/common/arch/arm64/configs/gki_defconfig
          sed -i -E 's/^(CONFIG_KSU[A-Z_]*)=y/# \1 is not set/; s/^CONFIG_KPM=y/# CONFIG_KPM is not set/' "$DEFCONFIG"
          grep -E "CONFIG_(KSU|KPM)" "$DEFCONFIG" || true
          cd ~/gki
          KMI_SYMBOL_LIST_STRICT_MODE=0 BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh -j2 2>&1 | tail -n 5
          KVER2=$(strings "$DIST/Image" | grep -m1 "Linux version 5")
          echo "bypass kernel: $KVER2"
          echo "$KVER2" | grep -q "5.10.236-android12-9" || { echo "::error::bypass kernel drifted: $KVER2"; exit 1; }
          cp -v "$DIST/Image" /tmp/ak3-images/Image-bypass
          ls -lh /tmp/ak3-images/

      - name: Prepare artifacts (AnyKernel3 x2)
        run: |
          set -e
          mkdir -p /tmp/artifacts
          if [ ! -f /tmp/ak3-images/Image-ksu ] || [ ! -f /tmp/ak3-images/Image-bypass ]; then
            echo "::error::kernel Images missing - version gate step failed"; ls -la /tmp/ak3-images/ || true; exit 1
          fi
          cp -v /tmp/ak3-images/Image-ksu /tmp/artifacts/Image-5.10.236-android12-KSU-KPM
          cp -v /tmp/ak3-images/Image-bypass /tmp/artifacts/Image-5.10.236-android12-BYPASS-noKSU
          # Complete anykernel.sh: previous generated one only had the properties block
          # (no . ak3-core.sh / split_boot / write_boot) -> flashing it did NOTHING.
          # Flow mirrors Wild Kernels reference: split_boot -> keep stock ramdisk -> write_boot.
          cat > /tmp/ak3-anykernel.sh <<'AKSH'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers
          properties() { '
          kernel.string=marble GKI 5.10.236-android12 DroidSpaces + SukiSU Ultra KPM by lakitu12
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          do.check_boot_version=0
          device.name1=marble
          device.name2=marblein
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          keycheck.timeout=20
          '; } # end properties
          
          # boot shell variables
          block=boot
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          no_magisk_check=1
          
          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh
          
          # boot install: dump current boot, replace only the kernel, keep the stock ramdisk
          split_boot
          
          if [ -f "$SPLITIMG/ramdisk.cpio" ]; then
              # marble stock boot carries a ramdisk -> repack preserves it, only kernel is swapped
              unpack_ramdisk
              write_boot
          else
              flash_boot
          fi
          
          ui_print " "
          ui_print "Kernel flashed. Original ramdisk preserved."
          AKSH
          pack_ak3() {
            IMG="$1"; OUT="$2"
            rm -rf /tmp/AnyKernel3
            git clone --depth=1 -q https://github.com/osm0sis/AnyKernel3 /tmp/AnyKernel3
            rm -f /tmp/AnyKernel3/README.md /tmp/AnyKernel3/anykernel.sh
            cp -v "$IMG" /tmp/AnyKernel3/Image
            cp -v /tmp/ak3-anykernel.sh /tmp/AnyKernel3/anykernel.sh
            ( cd /tmp/AnyKernel3 && zip -r9 "/tmp/artifacts/$OUT" * )
            echo "=== verify $OUT ==="
            unzip -l "/tmp/artifacts/$OUT" | tail -n 8
            unzip -p "/tmp/artifacts/$OUT" anykernel.sh | grep -E "split_boot|write_boot|ak3-core.sh" || { echo "::error::anykernel.sh missing install calls"; exit 1; }
            unzip -p "/tmp/artifacts/$OUT" Image | strings | grep -m1 "Linux version 5.10.236" || { echo "::error::wrong Image packed"; exit 1; }
          }
          pack_ak3 /tmp/ak3-images/Image-ksu "AnyKernel3-marble-5.10.236-android12-DroidSpaces-SukiSU-KPM.zip"
          pack_ak3 /tmp/ak3-images/Image-bypass "AnyKernel3-marble-5.10.236-android12-DroidSpaces-BYPASS-noKSU.zip"
          ls -lh /tmp/artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marble-5.10.236-android12-DroidSpaces-SukiSU-KPM
          path: /tmp/artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          echo "### Build complete - marble GKI 5.10.236-android12 (2025-05 pinned) DroidSpaces + SukiSU Ultra KPM" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Base: common-android12-5.10-2025-05 pinned (5.10.236-android12-9) + BYPASS no-KSU Image" >> $GITHUB_STEP_SUMMARY
          echo "- DroidSpaces: kABI patches + SUSFS (gki-android12-5.10) + LTO_THIN/CFI stock-compatible" >> $GITHUB_STEP_SUMMARY
          echo "- Root: SukiSU Ultra latest + CONFIG_KPM=y" >> $GITHUB_STEP_SUMMARY
          echo "- Device: marble (SM7475) HyperOS 3.0 Android 15" >> $GITHUB_STEP_SUMMARY
          ls -lh /tmp/artifacts/ >> $GITHUB_STEP_SUMMARY 2>&1 || true
