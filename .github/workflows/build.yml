name: Build marble LineageOS 24.0 (sm8450, 5.10.269) - DroidSpaces + SukiSU Ultra (KPM + SUSFS)

on:
  workflow_dispatch:
  push:
    branches: [lineage-24.0]
    paths:
      - '.github/workflows/build.yml'
      - '.github/scripts/**'

env:
  # --- all upstreams pinned (no floating refs) ---
  # LineageOS/android_kernel_xiaomi_sm8450 @ lineage-24.0 (Linux 5.10.269)
  LINEAGE_PIN: eff4b40407a1b6f1b1ab84554cbb540bcb495175
  # AOSP official clang prebuilt (lineage builds use r596125 internally; r547379 is the
  # newest single-version archive retrievable from android.googlesource.com)
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz
  # SukiSU Ultra `builtin` line: release tags do NOT define the KSU_SUSFS* Kconfig set
  KSU_PIN: c95d6e2c76adb11b0e438e518e32ac4e31f5b1d0
  # simonpunk/susfs4ksu branch gki-android13-5.10
  SUSFS_PIN: fec037cb8a0de768dd97d16fa65737cb6121b870
  # ravindu644/Droidspaces-OSS (kABI patches for GKI)
  DS_PIN: 0aa20da53656790aee4747537bfacb301b165aec
  # Numbersf/AnyKernel3 template (SukiSU-app compatible, uppercase vars)
  AK3_PIN: 0fc7569866bb5d5fe51752cc410dca3e92ab332f

jobs:
  build:
    # KSU (root + KPM + SUSFS) and BYPASS (no-KSU) builds are independent:
    # run them in parallel on separate runners (~18min total instead of ~35 serial)
    strategy:
      fail-fast: false
      matrix:
        variant: [ksu, bypass]
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 cpio pahole libncurses-dev rsync \
            curl zip unzip tar xz-utils gcc g++ gawk openssl \
            gcc-aarch64-linux-gnu device-tree-compiler

      - name: Fetch clang prebuilt (AOSP r547379)
        run: |
          mkdir -p "$HOME/clang"
          curl -fsSL --retry 3 -o /tmp/clang.tar.gz "$CLANG_URL"
          tar -xzf /tmp/clang.tar.gz -C "$HOME/clang"
          rm -f /tmp/clang.tar.gz
          "$HOME/clang/bin/clang" --version | sed -n '1,2p'

      - name: Clone LineageOS kernel tree (pinned)
        run: |
          set -e
          git clone --depth=1 -b lineage-24.0 https://github.com/LineageOS/android_kernel_xiaomi_sm8450 "$HOME/kl"
          cd "$HOME/kl"
          if [ "$(git rev-parse HEAD)" != "$LINEAGE_PIN" ]; then
            echo "branch tip moved to $(git rev-parse HEAD), fetching pinned rev"
            git fetch --depth=1 origin "$LINEAGE_PIN"
            git checkout -q FETCH_HEAD
          fi
          test "$(git rev-parse HEAD)" = "$LINEAGE_PIN" || { echo "::error::pin mismatch"; exit 1; }
          grep -E "^[[:space:]]*SUBLEVEL[[:space:]]*=[[:space:]]*269" Makefile || { echo "::error::kernel source is not 5.10.269"; exit 1; }
          git log --oneline -1
          # Deterministic version string: 5.10.269 (Makefile) + -gki (CONFIG_LOCALVERSION
          # from vendor/waipio_GKI.config) + -droidspaces-lakitu (this file; replaces -g<hash>)
          printf -- '-droidspaces-lakitu' > .scmversion
          cat .scmversion; echo
          # LTO note: the FULL/THIN choice members are only visible when HAS_LTO_CLANG
          # is y, which the tree gates on LLVM=1 + LLVM_IAS=1 + llvm NM/AR (arch/Kconfig).
          # Switch stock FULL -> THIN here; CFI_CLANG stays untouched (still real LTO).
          sed -i '/CONFIG_LTO/d' arch/arm64/configs/gki_defconfig
          printf '# CONFIG_LTO_NONE is not set\nCONFIG_LTO_CLANG_THIN=y\n' >> arch/arm64/configs/gki_defconfig
          tail -n 4 arch/arm64/configs/gki_defconfig

      - name: Apply DroidSpaces kABI patches
        run: |
          set -e
          cd "$HOME/kl"
          DS=https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/$DS_PIN/Documentation/resources/kernel-patches/GKI/below-kernel-6.12
          echo "=== 001 sysvipc kABI (6_7_8 variant, verified against this tree) ==="
          curl -fsSL "$DS/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch" -o /tmp/001.patch
          patch -p1 < /tmp/001.patch
          echo "=== 002 posix_mqueue kABI (5.10 and lower) ==="
          curl -fsSL "$DS/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch" -o /tmp/002.patch
          patch -p1 < /tmp/002.patch
          git diff --stat

      - name: Setup SukiSU Ultra (builtin, pinned)
        if: matrix.variant == 'ksu'
        run: |
          set -e
          cd "$HOME/kl"
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/$KSU_PIN/kernel/setup.sh" | bash -s "$KSU_PIN"
          ls -l drivers/kernelsu

      - name: Apply SUSFS (susfs4ksu, pinned)
        if: matrix.variant == 'ksu'
        run: |
          set -e
          cd "$HOME/kl"
          git clone -q https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          cd /tmp/susfs4ksu
          git checkout -q "$SUSFS_PIN"
          SUSFS_VER=$(grep -m1 'SUSFS_VERSION' kernel_patches/include/linux/susfs.h | cut -d'"' -f2)
          echo "SUSFS $SUSFS_VER"
          cp -v kernel_patches/fs/* "$HOME/kl/fs/"
          cp -v kernel_patches/include/linux/* "$HOME/kl/include/linux/"
          cd "$HOME/kl"
          echo "=== apply 50_add_susfs_in_gki-android13-5.10.patch ==="
          patch -p1 < /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.10.patch

      - name: Generate kernel config (LineageOS flow + DroidSpaces fragment)
        run: |
          set -e
          cd "$HOME/kl"
          export PATH="$HOME/clang/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/clang/lib64:$LD_LIBRARY_PATH"
          export TARGET_PRODUCT=marble
          MK="make O=$HOME/kl/out ARCH=arm64 TARGET_PRODUCT=marble LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-"
          mkdir -p out
          cp arch/arm64/configs/gki_defconfig out/.config
          $MK olddefconfig
          for frag in vendor/waipio_GKI.config vendor/xiaomi_GKI.config vendor/marble_GKI.config vendor/debugfs.config; do
            echo "=== merge $frag ==="
            scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/$frag
            $MK olddefconfig
          done

          # DroidSpaces GKI config fragment (kABI-safe set, Droidspaces Kernel-Configuration.md)
          cat > /tmp/lakitu.config <<'CFG'
          # DroidSpaces GKI support - only valid together with the kABI patches above
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_USER_NS=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_MACVLAN=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_KPROBES=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CFG
          if [ "${{ matrix.variant }}" = "ksu" ]; then
            cat >> /tmp/lakitu.config <<'CFG'
          # SukiSU Ultra (builtin) + KPM + SUSFS
          CONFIG_KSU=y
          CONFIG_KPM=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CFG
          fi
          scripts/kconfig/merge_config.sh -m -O out out/.config /tmp/lakitu.config
          $MK olddefconfig

          # (LTO FULL -> THIN was already applied to gki_defconfig in the clone step)
          echo "=== LTO state in out/.config ==="
          grep -E 'CONFIG_LTO' out/.config || true

          echo "=== early config gates ==="
          grep -q '^CONFIG_LTO_CLANG_THIN=y' out/.config || { echo "::error::LTO thin missing"; exit 1; }
          grep -q '^CONFIG_CFI_CLANG=y' out/.config || { echo "::error::CFI missing"; exit 1; }
          grep -q '^CONFIG_SYSVIPC=y' out/.config || { echo "::error::SYSVIPC missing"; exit 1; }
          grep -q '^CONFIG_POSIX_MQUEUE=y' out/.config || { echo "::error::POSIX_MQUEUE missing"; exit 1; }
          if [ "${{ matrix.variant }}" = "ksu" ]; then
            grep -q '^CONFIG_KSU=y' out/.config || { echo "::error::KSU missing (setup.sh not applied?)"; exit 1; }
            grep -q '^CONFIG_KSU_SUSFS=y' out/.config || { echo "::error::KSU_SUSFS missing (builtin Kconfig not applied?)"; exit 1; }
          else
            if grep -q '^CONFIG_KSU=y' out/.config; then echo "::error::bypass config must not enable KSU"; exit 1; fi
          fi
          echo "config gates passed"

      - name: Build kernel Image
        run: |
          set -e
          set -o pipefail
          # swap headroom for the LTO link stage on the 7GB runner
          sudo swapoff -a 2>/dev/null || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          cd "$HOME/kl"
          export PATH="$HOME/clang/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/clang/lib64:$LD_LIBRARY_PATH"
          make O=$HOME/kl/out ARCH=arm64 TARGET_PRODUCT=marble \
            LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            -j2 Image 2>&1 | tee build.log
          ls -lh out/arch/arm64/boot/Image

      - name: Version gate + ikconfig assertions (${{ matrix.variant }})
        run: |
          set -e
          cd "$HOME/kl"
          IMG=out/arch/arm64/boot/Image
          test -f "$IMG" || { echo "::error::Image not built"; exit 1; }
          KVER=$(strings "$IMG" | grep -m1 "Linux version 5")
          echo "kernel: $KVER"
          echo "$KVER" | grep -q "5.10.269" || { echo "::error::version drifted: $KVER"; exit 1; }
          echo "$KVER" | grep -q "droidspaces-lakitu" || { echo "::error::localversion suffix missing: $KVER"; exit 1; }

          CFG=$GITHUB_WORKSPACE/.github/scripts/extract-ikconfig
          chmod +x "$CFG"
          "$CFG" "$IMG" > /tmp/built-config
          grep -E "CONFIG_LTO_CLANG_THIN=|CONFIG_CFI_CLANG=y|CONFIG_SYSVIPC=y|CONFIG_POSIX_MQUEUE=y" /tmp/built-config
          if [ "${{ matrix.variant }}" = "ksu" ]; then
            grep -q "^CONFIG_KSU=y$" /tmp/built-config || { echo "::error::KSU missing in ksu build"; exit 1; }
            grep -q "^CONFIG_KPM=y$" /tmp/built-config || { echo "::error::KPM missing in ksu build"; exit 1; }
            grep -q "^CONFIG_KSU_SUSFS=y$" /tmp/built-config || { echo "::error::SUSFS missing in ksu build"; exit 1; }
          else
            grep -Eq "^CONFIG_KSU=(y|m)$" /tmp/built-config && { echo "::error::KSU must be off in bypass build"; exit 1; }
            grep -Eq "^CONFIG_KPM=(y|m)$" /tmp/built-config && { echo "::error::KPM must be off in bypass build"; exit 1; }
            echo "bypass: KSU/KPM confirmed off"
          fi
          mkdir -p /tmp/ak3-images
          if [ "${{ matrix.variant }}" = "ksu" ]; then
            cp -v "$IMG" /tmp/ak3-images/Image-ksu
          else
            cp -v "$IMG" /tmp/ak3-images/Image-bypass
          fi

      - name: Prepare AnyKernel3 (${{ matrix.variant }})
        run: |
          set -e
          mkdir -p /tmp/artifacts
          # Base: Numbersf/AnyKernel3 (SukiSU-Ultra main maintainer) - uppercase var
          # convention (BLOCK/IS_SLOT_DEVICE/NO_MAGISK_CHECK) that the SukiSU app
          # flasher expects. Pinned + tool-size gated (drifted magiskboot once panicked).
          git clone -q https://github.com/Numbersf/AnyKernel3 /tmp/AK3t
          git -C /tmp/AK3t checkout -q "$AK3_PIN"
          git -C /tmp/AK3t log -1 --format='AK3 @ %h %ad %s' --date=short
          test "$(stat -c %s /tmp/AK3t/tools/magiskboot)" = "788840" || { echo "::error::magiskboot drift"; exit 1; }
          test "$(stat -c %s /tmp/AK3t/tools/magiskpolicy)" = "356584" || { echo "::error::magiskpolicy drift"; exit 1; }

          cat > /tmp/ak3-anykernel.sh <<'AKSH'
          ### AnyKernel3 Ramdisk Mod Script
          ## marble LineageOS 24.0 (5.10.269) by lakitu12 (template: Numbersf/AnyKernel3, SukiSU app-compatible)
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=marble LineageOS 24.0 5.10.269 DroidSpaces + SUSFS + SukiSU Ultra KPM by lakitu12
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=marble
          device.name2=marblein
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          ## boot shell variables
          BLOCK=boot
          IS_SLOT_DEVICE=auto
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto
          NO_MAGISK_CHECK=1

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh

          sync
          sleep 0.5
          chmod -R 755 $AKHOME/tools

          ui_print " Installing marble LineageOS 24.0 kernel..."
          ui_print " Splitting boot, replacing kernel, keeping stock ramdisk"

          split_boot
          if [ -f "split_img/ramdisk.cpio" ]; then
              unpack_ramdisk
              write_boot
          else
              flash_boot
          fi

          ui_print " Done. Original ramdisk preserved."
          AKSH

          if [ "${{ matrix.variant }}" = "ksu" ]; then
            IMG=/tmp/ak3-images/Image-ksu
            OUT="AnyKernel3-marble-lineage24-5.10.269-DroidSpaces-SUSFS-SukiSU-KPM.zip"
            RAW="Image-5.10.269-gki-droidspaces-lakitu-KSU-KPM"
          else
            IMG=/tmp/ak3-images/Image-bypass
            OUT="AnyKernel3-marble-lineage24-5.10.269-DroidSpaces-BYPASS-noKSU.zip"
            RAW="Image-5.10.269-gki-droidspaces-lakitu-BYPASS-noKSU"
          fi
          rm -rf /tmp/AnyKernel3
          cp -r /tmp/AK3t /tmp/AnyKernel3
          rm -rf /tmp/AnyKernel3/.git /tmp/AnyKernel3/anykernel.sh
          cp -v "$IMG" /tmp/AnyKernel3/Image
          cp -v /tmp/ak3-anykernel.sh /tmp/AnyKernel3/anykernel.sh
          chmod +x /tmp/AnyKernel3/tools/* /tmp/AnyKernel3/META-INF/com/google/android/update-binary
          ( cd /tmp/AnyKernel3 && zip -r9 -q "/tmp/artifacts/$OUT" . )
          cp -v "$IMG" "/tmp/artifacts/$RAW"
          echo "=== verify $OUT ==="
          unzip -p "/tmp/artifacts/$OUT" anykernel.sh | grep -E "^BLOCK=boot" || { echo "::error::uppercase BLOCK missing"; exit 1; }
          unzip -p "/tmp/artifacts/$OUT" anykernel.sh | grep -E "split_boot|write_boot" || { echo "::error::anykernel.sh missing install calls"; exit 1; }
          unzip -p "/tmp/artifacts/$OUT" Image | strings | grep -m1 "droidspaces-lakitu" || { echo "::error::wrong Image packed"; exit 1; }
          ls -lh /tmp/artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marble-lineage24-5.10.269-${{ matrix.variant }}
          path: /tmp/artifacts/*
          if-no-files-found: error
          retention-days: 14